apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: "Cluster Root CA"
  secretName: root-ca-tls-secret
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io