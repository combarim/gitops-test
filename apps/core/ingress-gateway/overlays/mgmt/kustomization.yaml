apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namespace: ingress-gateway

patches:
  - target:
      kind: Certificate
      name: wildcard-tls
    patch: |-
      - op: add
        path: /spec/commonName
        value: "*.inforisk.ma"
      - op: add
        path: /spec/dnsNames
        value: ["*.inforisk.ma", "inforisk.ma"]
