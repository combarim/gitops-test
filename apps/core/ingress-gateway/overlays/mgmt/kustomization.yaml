apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namespace: ingress-gateway

patches:
  - target:
      kind: Certificate
      name: wildcard-tls
    patch: |-
      - op: add
        path: /spec/commonName
        value: "*.inforisk.ma"
      - op: add
        path: /spec/dnsNames
        value: ["*.inforisk.ma", "inforisk.ma"]
      - op: replace
        path: /spec/secretName
        value: "tls-inforisk-ma"
  - target:
      kind: Gateway
      name: main-gateway
    patch: |-
      - op: replace
        path: /spec/listeners/1/tls/certificateRefs/0/name
        value: "tls-inforisk-ma"
