minio:
  enabled: false

loki:
  auth_enabled: false
  useTestSchema: true
  extraArgs:
    - -config.expand-env=true
  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-ruler
      admin: loki-data
    s3:
      endpoint: minio.observability.svc
      accessKeyId: ${MINIO_ACCESS_KEY}
      secretAccessKey: ${MINIO_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true

deploymentMode: SimpleScalable

global:
  extraEnv:
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: username
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: password

# Lower resources for local deployment
read:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

write:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
