minio:
  enabled: false

loki:
  auth_enabled: false
  useTestSchema: true
  extraArgs:
    - -config.expand-env=true
  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-ruler
      admin: loki-data
    s3:
      endpoint: minio.observability.svc
      accessKeyId: ${MINIO_ACCESS_KEY}
      secretAccessKey: ${MINIO_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true

deploymentMode: SimpleScalable

gateway:
  enabled: true
  nginxConfig:
    resolver: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local.

global:
  extraEnv:
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: username
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: password

# Disable caches for small cluster (insufficient memory)
chunksCache:
  enabled: false

resultsCache:
  enabled: false
  allocatedMemory: 256

# Lower resources for local deployment
read:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

write:
  replicas: 1
  persistence:
    storageClass: longhorn-observability
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

backend:
  replicas: 1
  persistence:
    storageClass: longhorn-observability
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
