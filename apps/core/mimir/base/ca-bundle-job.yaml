apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-bundle-creator
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ca-bundle-creator
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
    resourceNames: ["observability-ca-bundle", "mimir-ca-bundle"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-bundle-creator
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ca-bundle-creator
subjects:
  - kind: ServiceAccount
    name: ca-bundle-creator
    namespace: observability
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-mimir-ca-bundle
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: ca-bundle-creator
      restartPolicy: OnFailure
      containers:
        - name: create-bundle
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Extract root CA (ca.crt) and intermediate CA (tls.crt)
              kubectl get secret observability-ca-bundle -n observability -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/root-ca.crt
              kubectl get secret observability-ca-bundle -n observability -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/intermediate-ca.crt

              # Combine them into a bundle (intermediate first, then root)
              cat /tmp/intermediate-ca.crt /tmp/root-ca.crt > /tmp/ca-bundle.crt

              # Create or update the secret
              kubectl create secret generic mimir-ca-bundle \
                --from-file=ca-bundle.crt=/tmp/ca-bundle.crt \
                --namespace=observability \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "CA bundle created successfully"
