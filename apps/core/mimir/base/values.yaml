minio:
  enabled: false

mimir:
  structuredConfig:
    alertmanager_storage:
      backend: s3
      s3:
        endpoint: minio.observability.svc:9000
        access_key_id: minioadmin
        secret_access_key: minioadmin_password
        insecure: true
        bucket_name: mimir-ruler

    blocks_storage:
      backend: s3
      s3:
        endpoint: minio.observability.svc:9000
        access_key_id: minioadmin
        secret_access_key: minioadmin_password
        insecure: true
        bucket_name: mimir-blocks

    ruler_storage:
      backend: s3
      s3:
        endpoint: minio.observability.svc:9000
        access_key_id: minioadmin
        secret_access_key: minioadmin_password
        insecure: true
        bucket_name: mimir-ruler

alertmanager:
  enabled: true

# Resources limits are lowered for a homelab/local setup
ingester:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

distributor:
  replicas: 1

querier:
  replicas: 1

query_frontend:
  replicas: 1

compactor:
  replicas: 1

store_gateway:
  replicas: 1
