mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: minio-hl.observability.svc:9000
          access_key_id: ${MINIO_ACCESS_KEY}
          secret_access_key: ${MINIO_SECRET_KEY}
          insecure: true
    blocks_storage:
      s3:
        bucket_name: mimir-data
    alertmanager_storage:
      s3:
        bucket_name: mimir-ruler
    ruler_storage:
      s3:
        bucket_name: mimir-ruler


gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  nginx:
    config:
      resolver: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local.

global:
  extraEnv:
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: username
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root-creds
          key: password
  clusterLabel:
    enabled: false

enterprise:
  enabled: false

# Use single replica storage for PoC
metaMonitoring:
  serviceMonitor:
    enabled: false

alertmanager:
  persistentVolume:
    enabled: true
    storageClass: longhorn-observability
    size: 1Gi

rollout_operator:
  enabled: false

ingester:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistentVolume:
    enabled: true
    storageClass: longhorn-observability
    size: 1Gi
  zoneAwareReplication:
    enabled: false

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

compactor:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistentVolume:
    enabled: true
    storageClass: longhorn-observability
    size: 1Gi

store_gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistentVolume:
    enabled: true
    storageClass: longhorn-observability
    size: 1Gi
  zoneAwareReplication:
    enabled: false

ruler:
  enabled: false

minio:
  enabled: false

# Disable Kafka - use classic mode for PoC (reduces storage needs)
kafka:
  enabled: false
