tenant:
  name: minio

  configuration:
    name: minio-root-creds

  configSecret:
    name: minio-root-creds
    existingSecret: true

  tls:
    enabled: true
    autoCert: false
    externalCertSecret:
      - name: minio-server-tls
        type: kubernetes.io/tls

  buckets:
    - name: loki-data
    - name: loki-ruler
    - name: mimir-data
    - name: mimir-ruler

  pools:
    - name: data
      servers: 1
      volumesPerServer: 2
      size: 5Gi
      storageClassName: longhorn-prod
