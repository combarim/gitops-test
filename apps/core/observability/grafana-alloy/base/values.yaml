alloy:
  configMap:
    content: |
      // --- COLLECTE DES MÉTRIQUES (VictoriaMetrics) ---
      discovery.kubernetes "pods" { role = "pod" }
      discovery.kubernetes "services" { role = "service" }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action = "keep"
          regex = "true"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
      }

      prometheus.scrape "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [prometheus.remote_write.victoria_metrics.receiver]
      }

      prometheus.remote_write "victoria_metrics" {
        endpoint {
          url = "http://victoria-metrics-victoria-metrics-single-server.observability.svc:8428/api/v1/write"
        }
      }

      // --- COLLECTE DES LOGS (Loki) ---
      discovery.kubernetes "all_pods" { role = "pod" }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.all_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "local_pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.loki_service.receiver]
      }

      loki.write "loki_service" {
        endpoint {
          url = "http://loki-gateway.observability.svc/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

rbac:
  create: true

serviceAccount:
  create: true