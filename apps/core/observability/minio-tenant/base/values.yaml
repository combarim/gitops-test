tenant:
  name: minio

  configuration:
    name: minio-root-creds

  configSecret:
    name: minio-root-creds
    existingSecret: true

  certificate:
    requestAutoCert: false

  buckets:
    - name: loki-chunks
    - name: loki-ruler

  pools:
    - name: data
      servers: 1
      volumesPerServer: 2
      size: 3Gi
      storageClassName: longhorn-observability
