apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: cattle-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rancher-ca
  namespace: cattle-system
spec:
  secretName: tls-rancher
  commonName: rancher-ca
  isCA: true
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rancher-ca-issuer
  namespace: cattle-system
spec:
  ca:
    secretName: tls-rancher
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rancher-tls
  namespace: cattle-system
spec:
  secretName: rancher-tls-secret
  commonName: rancher.inforisk.ma
  dnsNames:
    - rancher.inforisk.ma
  issuerRef:
    name: rancher-ca-issuer
    kind: Issuer
