apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: infisical-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    infisical:
      hostAPI: http://infisical.infisical.svc.cluster.local
      auth:
        # Token créé automatiquement par autoBootstrap d'Infisical
        # Note: le token n'est pas auto-renouvelé — à remplacer par
        # universalAuthCredentials pour un usage long-terme
        tokenAuthCredentials:
          accessToken:
            name: infisical-bootstrap-credentials
            namespace: infisical
            key: accessToken
      secretsScope:
        # À ajuster selon le projet et l'environnement créés dans Infisical UI
        projectSlug: inforisk
        environmentSlug: mgmt
        secretPath: "/"
