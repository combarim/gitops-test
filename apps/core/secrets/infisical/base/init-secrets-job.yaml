apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-init
subjects:
  - kind: ServiceAccount
    name: infisical-init
    namespace: infisical
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-init-secrets
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: infisical-init
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add -q curl

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API=https://kubernetes.default.svc
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --cacert "$CA" \
                -H "Authorization: Bearer $TOKEN" \
                "$API/api/v1/namespaces/infisical/secrets/infisical-secrets")

              if [ "$STATUS" = "200" ]; then
                echo "infisical-secrets already exists, skipping"
                exit 0
              fi

              ENCRYPTION_KEY=$(tr -dc '0-9a-f' </dev/urandom | head -c32)
              AUTH_SECRET=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c44)
              DB_PASSWORD=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c24)

              b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"infisical-secrets","namespace":"infisical"},"data":{"ENCRYPTION_KEY":"%s","AUTH_SECRET":"%s","POSTGRES_PASSWORD":"%s","DB_CONNECTION_URI":"%s","REDIS_URL":"%s","SITE_URL":"%s"}}' \
                "$(b64 "$ENCRYPTION_KEY")" \
                "$(b64 "$AUTH_SECRET")" \
                "$(b64 "$DB_PASSWORD")" \
                "$(b64 "postgresql://infisical:${DB_PASSWORD}@infisical-postgresql.infisical.svc.cluster.local:5432/infisicalDB")" \
                "$(b64 "redis://infisical-redis-master.infisical.svc.cluster.local:6379")" \
                "$(b64 "http://infisical.infisical.svc.cluster.local")" \
                > /tmp/secret.json

              curl -sf --cacert "$CA" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d @/tmp/secret.json \
                "$API/api/v1/namespaces/infisical/secrets"

              echo "infisical-secrets created"
