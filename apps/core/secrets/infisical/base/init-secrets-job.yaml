apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-init
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-init
subjects:
  - kind: ServiceAccount
    name: infisical-init
    namespace: infisical
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-init-secrets
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: infisical-init
      restartPolicy: OnFailure
      containers:
        - name: init
          image: bitnami/kubectl:1.31
          command:
            - /bin/sh
            - -c
            - |
              set -e

              if kubectl get secret infisical-secrets -n infisical > /dev/null 2>&1; then
                echo "infisical-secrets already exists, skipping"
                exit 0
              fi

              ENCRYPTION_KEY=$(tr -dc '0-9a-f' </dev/urandom 2>/dev/null | head -c32)
              AUTH_SECRET=$(tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c44)
              DB_PASSWORD=$(tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c24)

              kubectl create secret generic infisical-secrets \
                --namespace infisical \
                --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" \
                --from-literal=AUTH_SECRET="$AUTH_SECRET" \
                --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
                --from-literal=DB_CONNECTION_URI="postgresql://infisical:${DB_PASSWORD}@infisical-postgresql.infisical.svc.cluster.local:5432/infisicalDB" \
                --from-literal=REDIS_URL="redis://infisical-redis-master.infisical.svc.cluster.local:6379" \
                --from-literal=SITE_URL="http://infisical.infisical.svc.cluster.local"

              echo "infisical-secrets created"
