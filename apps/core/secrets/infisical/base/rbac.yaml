apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-bootstrap-sa
  namespace: infisical

--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infisical-bootstrap-cr
spec:
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "create", "update", "delete"]

--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-bootstrap-binding
spec:
  roleRef:
    kind: ClusterRole
    name: infisical-bootstrap-cr
    apiGroup: rbac.authorization.k8s.io
  subjects:
    - kind: ServiceAccount
      name: infisical-bootstrap-sa
      namespace: infisical
