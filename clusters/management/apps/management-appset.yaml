apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: management-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/combarim/gitops-test.git
        revision: main
        files:
          - path: "apps/core/*/config.json"
  template:
    metadata:
      name: '{{.path.basenameNormalized}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{default "0" .syncWave}}'
    spec:
      project: default
      source:
        repoURL: '{{.url}}'
        targetRevision: main
        path: 'apps/core/{{.path.basenameNormalized}}/overlays/mgmt'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: bgppeers.metallb.io # La règle ne s'appliquera qu'à ce CRD précis
        jsonPointers:
          - /spec/conversion/webhook/clientConfig/caBundle