apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: management-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/cascade-delete
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/combarim/gitops-test.git
        revision: main
        files:
          - path: "apps/core/*/config.json"
  template:
    metadata:
      name: '{{.path.basenameNormalized}}-mgmt'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{default "0" .syncWave}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/combarim/gitops-test.git
        targetRevision: main
        path: 'apps/core/{{.path.basenameNormalized}}/overlays/mgmt'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: bgppeers.metallb.io
        jsonPointers:
          - /spec/conversion/webhook/clientConfig/caBundle
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: '*.longhorn.io'
        jqPathExpressions:
          - '.status'
          - '.metadata.labels["longhorn-manager"]'
        jsonPointers:
          - /spec/preserveUnknownFields